name: Build APK

# Run it by hand: GitHub > Actions > "Build APK" > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: flutter create . --platforms android --project-name attend_hub --org com.ecell.attendhub

      - name: Add internet + camera permission and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="AttendHub"|' $M

      - name: Make every plugin build against Android API 36
        run: |
          mkdir -p $HOME/.gradle/init.d
          cat > $HOME/.gradle/init.d/force-compile-sdk.gradle <<'GRADLE'
          allprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      try {
                          p.android.compileSdk = 36
                      } catch (Throwable ignored) {
                          p.android.compileSdkVersion(36)
                      }
                      // Keep the camera/barcode libraries intact in the APK
                      // (code shrinking can break them on some phones).
                      if (p.name == 'app') {
                          try { p.android.buildTypes.release.shrinkResources = false } catch (Throwable ignored) {}
                          try { p.android.buildTypes.release.minifyEnabled = false } catch (Throwable ignored) {}
                      }
                  }
              }
          }
          GRADLE
          cat $HOME/.gradle/init.d/force-compile-sdk.gradle

      - name: Show the permissions in the manifest
        run: grep -n "uses-permission\|uses-feature\|android:label" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release --no-shrink
          "--dart-define=APP_BASE_URL=${{ vars.APP_BASE_URL }}"
          "--dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}"
          "--dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}"
          "--dart-define=DEPT_NAME=${{ vars.DEPT_NAME }}"

      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk AttendHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AttendHub-apk
          path: AttendHub.apk

      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AttendHub APK ${{ github.run_number }}
          files: AttendHub.apk
